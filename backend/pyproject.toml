[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors (bugs, unused imports, etc.)
# I: import sorting (replaces isort)
# UP: pyupgrade (flags outdated syntax patterns)
# B: flake8-bugbear (common gotchas, e.g. mutable default args)
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["database", "horoscope_service", "main", "models"]
 
[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# Explicitly puts this directory (containing main.py, database.py, etc.)
# on the import path for tests. Without this, "import main" inside a test
# file can fail depending on whether you run `pytest` vs `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]