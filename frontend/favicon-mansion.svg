<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="orb" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#c9a6ff" />
      <stop offset="35%" stop-color="#7b2ff7" />
      <stop offset="100%" stop-color="#150a24" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ambient glow behind the orb -->
  <circle cx="16" cy="14" r="15" fill="url(#glow)" />

  <!-- the orb -->
  <circle cx="16" cy="14" r="11.5" fill="url(#orb)" />
  <ellipse cx="12" cy="9.5" rx="3.6" ry="2.2" fill="#ffffff" opacity="0.4" />

  <!-- plinth -->
