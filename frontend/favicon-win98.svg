<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000080" />
      <stop offset="1" stop-color="#1084d0" />
    </linearGradient>
    <radialGradient id="tinyOrb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c9a6ff" />
      <stop offset="45%" stop-color="#7b2ff7" />
      <stop offset="100%" stop-color="#2a1550" />
    </radialGradient>
  </defs>

  <!-- window body -->
  <rect x="2" y="5" width="28" height="24" fill="#c0c0c0" stroke="#000000" stroke-width="1.2" />

  <!-- title bar -->
  <rect x="2" y="5" width="28" height="7" fill="url(#titlebar)" stroke="#000000" stroke-width="1.2" />
  <!-- tiny control buttons -->
  <rect x="21" y="7" width="3" height="3" fill="#c0c0c0" stroke="#000000" stroke-width="0.6" />
  <rect x="25" y="7" width="3" height="3" fill="#c0c0c0" stroke="#000000" stroke-width="0.6" />

  <!-- the crystal ball, resting inside the window body -->
  <circle cx="16" cy="21" r="6.5" fill="url(#tinyOrb)" stroke="#000000" stroke-width="0.6" />
  <ellipse cx="14" cy="18.5" rx="1.8" ry="1" fill="#ffffff" opacity="0.5" />
  <rect x="12" y="27" width="8" height="1.6" rx="0.8" fill="#3b2415" />
</svg>
